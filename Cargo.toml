[package]
name = "abgrund_dice"
version = "0.1.0"
edition = "2021"
description = "Dice rolling engine in Rust with PyO3 bindings"
license = "MIT"

[lib]
name = "abgrund_dice"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# 只在「建 wheel」時開啟：開啟後不連結 libpython（由直譯器在 import 時提供符號）
# 因此 `cargo test` 必須在關閉此 feature 的情況下執行。
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py313"] }
logos = "0.16"
winnow = "1.0"
thiserror = "2.0"
rand = "0.10"
once_cell = "1.21.4"

[dev-dependencies]

# Integration tests live at the repo root (outside the crate) so they can be
# shared with the Python differential suite. Cargo resolves these relative
# paths from the crate directory.
[[test]]
name = "engine"
path = "../../tests/engine.rs"

[[test]]
name = "fuzz"
path = "../../tests/fuzz.rs"

[[example]]
name = "bench"
path = "../../examples/bench.rs"

[[example]]
name = "profile"
path = "../../examples/profile.rs"

[profile.release]
lto = true
codegen-units = 1
