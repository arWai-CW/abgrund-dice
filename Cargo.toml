[package]
name = "abgrund_dice"
version = "0.1.0"
edition = "2021"
description = "Dice rolling engine in Rust with PyO3 bindings"
license = "MIT"

[lib]
name = "abgrund_dice"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# 只在「建 wheel」時開啟：開啟後不連結 libpython（由直譯器在 import 時提供符號），
# 因此 `cargo test` 必須在關閉此 feature 的情況下執行。
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py313"] }
logos = "0.16"
winnow = "1.0"
thiserror = "2.0"
rand = "0.10"

[dev-dependencies]

[profile.release]
lto = true
codegen-units = 1
